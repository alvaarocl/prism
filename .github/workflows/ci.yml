name: macOS
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Test packet encoders and guards
        run: swift test
      - name: Build native release
        run: swift build -c release
